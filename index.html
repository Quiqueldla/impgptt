<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - IMPGPT</title>

<style>
:root{
    --green:#1de9b6;
    --blue:#0a3d62;
    --dark:#05090c;
    --text:#e6f1f5;
    --muted:#8faab3;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(145deg,rgb(1,1,56),rgb(1,94,1));
}

.login-container{
    width:400px;
    padding:35px;
    background:linear-gradient(180deg,#0e1b21,#071014);
    border-radius:20px;
    box-shadow:0 0 40px rgba(0,0,0,.7);
    text-align:center;
}

.logo{
    color:rgb(28,211,83);
    font-size:35px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#071014;
    color:var(--text);
}
.senha-box{
    position:relative;
}

.senha-box input{
    padding-right:50px;
}

#toggleSenha{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#8faab3;
    font-size:18px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(
        135deg,
        rgb(1,94,1),
        rgb(28,211,83)
    );
}

.forgot{
    margin-top:15px;
}

.forgot a{
    color:var(--green);
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">IMPGPT</div>

    <div class="subtitle">
        Faça login para continuar
    </div>

    <form id="loginForm">

              <div class="input-group">
           <input
    type="email"
    id="email"
    placeholder="exemplo@gmail.com"
    autocomplete="email"
    required>
        </div>

      <div class="input-group senha-box">
    <input
        type="password"
        id="senha"
        placeholder="Palavra-passe"
        required>

    <span id="toggleSenha">👁️</span>
</div>

        <button class="login-btn" type="submit" >
            Entrar
        </button>

       

        <div class="forgot">
            <a href="cadastro.html">Criar conta</a>
        </div>

    </form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const toggleSenha = document.getElementById("toggleSenha");
const senha = document.getElementById("senha");

toggleSenha.addEventListener("click", () => {

    if (senha.type === "password") {
        senha.type = "text";
        toggleSenha.textContent = "🙈";
    } else {
        senha.type = "password";
        toggleSenha.textContent = "👁️";
    }

});

const firebaseConfig = {
  apiKey: "AIzaSyAa-O6e2KrXBGzS-IrCKhnFOsyA9ER8sws",
  authDomain: "impgpt-502e3.firebaseapp.com",
  projectId: "impgpt-502e3",
  storageBucket: "impgpt-502e3.firebasestorage.app",
  messagingSenderId: "419048917438",
  appId: "1:419048917438:web:eb5b85797dc1d54a5851ef",
  measurementId: "G-WZ4NGJTFHW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("senha").value;

    try {

        alert("Tentando fazer login...");

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert("Login realizado com sucesso!");

        // Página que abre após o login
        window.location.href = "home.html";

    } catch (error) {

        if (error.code === "auth/invalid-credential") {

            alert("Email ou senha incorretos.");

        } else if (error.code === "auth/user-not-found") {

            alert("Utilizador não encontrado.");

        } else if (error.code === "auth/wrong-password") {

            alert("Senha incorreta.");

        } else {

            alert("Erro: " + error.message);

        }

        console.error(error);

    }

});

</script>

</body>
</html>
