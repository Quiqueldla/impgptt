<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - IMPGPT</title>

<style>
:root{
    --green:#1de9b6;
    --dark:#05090c;
    --text:#e6f1f5;
    --muted:#8faab3;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(145deg,rgb(1,1,56),rgb(1,94,1));
}

.login-container{
    width:400px;
    padding:35px;
    background:linear-gradient(180deg,#0e1b21,#071014);
    border-radius:20px;
    box-shadow:0 0 40px rgba(0,0,0,.7);
    text-align:center;
}

.senha-box{
    position:relative;
}

.senha-box input{
    padding-right:50px;
}

#toggleSenha{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#8faab3;
    font-size:18px;
}
.logo{
    color:rgb(28,211,83);
    font-size:35px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#071014;
    color:var(--text);
    font-size:15px;
}

.input-group input::placeholder{
    color:var(--muted);
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(
        135deg,
        rgb(1,94,1),
        rgb(28,211,83)
    );
    color:#001;
    transition:.3s;
}

.login-btn:hover{
    transform:scale(1.03);
}

.forgot{
    margin-top:15px;
}

.forgot a{
    color:var(--green);
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">IMPGPT</div>

    <div class="subtitle">
        Faça o cadastro para continuar
    </div>

    <form id="cadastroForm">

        <div class="input-group">
            <input
                type="text"
                id="nome"
                placeholder="Nome de utilizador"
                required>
        </div>

        <div class="input-group">
           <input
    type="email"
    id="email"
    placeholder="exemplo@gmail.com"
    autocomplete="email"
    required>
        </div>

       <div class="input-group senha-box">
    <input
        type="password"
        id="senha"
        placeholder="Palavra-passe"
        required>

    <span id="toggleSenha">👁️</span>
</div>

        <button class="login-btn" type="submit">
            Criar Conta
        </button>

        <div class="forgot">
            <a href="login.html">Já tenho uma conta</a>
        </div>

    </form>

</div>

<script type="module">
    const toggleSenha =
document.getElementById("toggleSenha");

const senha =
document.getElementById("senha");

toggleSenha.addEventListener("click", ()=>{

    if(senha.type === "password"){
        senha.type = "text";
        toggleSenha.textContent = "🙈";
    }else{
        senha.type = "password";
        toggleSenha.textContent = "👁️";
    }

});

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAa-O6e2KrXBGzS-IrCKhnFOsyA9ER8sws",
  authDomain: "impgpt-502e3.firebaseapp.com",
  projectId: "impgpt-502e3",
  storageBucket: "impgpt-502e3.firebasestorage.app",
  messagingSenderId: "419048917438",
  appId: "1:419048917438:web:eb5b85797dc1d54a5851ef",
  measurementId: "G-WZ4NGJTFHW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("cadastroForm")
.addEventListener("submit", async (e)=>{

    e.preventDefault();

    const nome =
        document.getElementById("nome").value;

    const email =
        document.getElementById("email").value;

    const senha =
        document.getElementById("senha").value;

    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                senha
            );

        await updateProfile(
            userCredential.user,
            {
                displayName:nome
            }
        );

        alert("Conta criada com sucesso!");

        window.location.href="login.html";

    }catch(error){

        alert(error.message);

    }

});

</script>

</body>
</html>
